stages:
  - prepare
  - build
  - test
  - publish

include:
  - project: kubernetes/linstor-kubernetes-tests
    ref: v2.12.0
    file: k8s-test.gitlab-ci.yml

prepare:
  image: ${LINBIT_DOCKER_REGISTRY}/build-helpers:latest
  stage: prepare
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
  variables:
    # git describe needs full history access
    GIT_DEPTH: 0
    # git describe does not need the submodule
    GIT_SUBMODULE_STRATEGY: none
  script:
    - SEMVER="$(semver-from-git.py)"
    - echo "SEMVER=${SEMVER}" >> .ci-build.env
    - echo "TAG=v${SEMVER/+/-}" >> .ci-build.env
  artifacts:
    reports:
      dotenv: .ci-build.env

prepare-k8s-test-bins:
  extends: .k8s-test-prepare
  stage: prepare
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG

# A single stable platform: latest stable Kubernetes with containerd and
# flannel. The tests cover the CSI driver and LINSTOR rather than the Kubernetes
# APIs, and the fixed platform lets the runs reuse the cached provisioned VM
# images.
create-k8s-test-configs:
  extends: .k8s-test-configs
  stage: prepare
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
  variables:
    K8S_TEST_RELEASES_TO_CHECK: "1"
    K8S_TEST_INCLUDE_NEXT: "false"
    K8S_TEST_RANDOMIZE_CNI: "false"
    K8S_TEST_RANDOMIZE_CRI: "false"

build:
  stage: build
  image: ${LINBIT_DOCKER_REGISTRY}/container-tools:latest
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 1
    NOCACHE: "false"
    REPO_SOURCE: ${LINBIT_DOCKER_REGISTRY}/rhel-container-secrets:latest
    REGISTRY: ${LINBIT_DOCKER_REGISTRY}
    PLATFORMS: ${PUBLISH_PLATFORMS}
    LINBIT_REPO: ${LINBIT_RHEL_DRBD9_REPO}
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
      variables:
        NOCACHE: "true"
  script:
    - docker buildx bake --pull --push --no-cache="${NOCACHE}"
    - echo "CSI_PLUGIN_IMAGE=${LINBIT_DOCKER_REGISTRY}/linstor-csi:${TAG}" > .build.env
    - echo "NFS_SERVER_IMAGE=${LINBIT_DOCKER_REGISTRY}/nfs-server:${TAG}" >> .build.env
  artifacts:
    reports:
      dotenv:
        - .build.env

make-tar:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_TAG
  image: golang:1
  script:
    - make bin-release ARCH="amd64 arm64 s390x ppc64le" SKIP_VERSION_CHECK=1 SEMVER=$SEMVER
  artifacts:
    paths:
      - out/
    exclude:
      - out/test

.container_scanning:
  stage: test
  rules:
  - if: $CI_MERGE_REQUEST_ID
  - if: $CI_COMMIT_BRANCH == 'master'
  - if: $CI_COMMIT_TAG
  image: ${LINBIT_DOCKER_REGISTRY}/trivy:latest
  variables:
    # No need to clone the repo, we exclusively work on artifacts.  See
    # https://docs.gitlab.com/ee/ci/runners/README.html#git-strategy
    GIT_STRATEGY: none
  script:
  - trivy --version
  - trivy image --exit-code 0 --format template --template "@/contrib/html.tpl" -o container-scan.html "$IMAGE"
  # Prints full report
  - trivy image --exit-code 0 "$IMAGE"
  # Fail on critical (unfixed) vulnerabilities
  - trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL "$IMAGE"
  # Ideally, we would use container_scanning for the artifact here. That is currently a paid feature, so we have to use code quality
  artifacts:
    when: always
    paths:
    - container-scan.html

container_scanning:csi-plugin:
  extends:
  - .container_scanning
  variables:
    IMAGE: $CSI_PLUGIN_IMAGE
  artifacts:
    expose_as: "Container Scan - CSI Plugin"

container_scanning:nfs-server:
  extends:
  - .container_scanning
  variables:
    IMAGE: $NFS_SERVER_IMAGE
  artifacts:
    expose_as: "Container Scan - NFS Server"

# The upstream e2e suites. Start the job from its job page rather than with the
# play button to pick the suites to run:
#   k8s-e2e-storage  the storage e2e suite on the ipv4 variant
#   kubevirt         the KubeVirt e2e suite, with live migration exercising
#                    DRBD dual-primary through RWX block volumes
#   shared           the storage e2e and KubeVirt suites on a storage pool on a
#                    disk shared between all VMs, locked by LINSTOR and by
#                    lvmlockd, without DRBD
# The chosen suites share one vmshed run on one runner, so a combined run takes
# longer than separate ones.
e2e-test:
  extends: .k8s-test
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == 'master'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  # Room for all three suites in one run: the kubevirt and shared suites alone
  # get 7h and 8h in the tests' own pipeline.
  timeout: 16h
  inputs:
    suites:
      type: array
      default: [k8s-e2e-storage]
      options: [k8s-e2e-storage, kubevirt, shared]
      description: The e2e suites to run
  needs:
    - prepare
    - build
    - prepare-k8s-test-bins
    - create-k8s-test-configs
  before_script:
    - |
      cat <<EOF > virter/kustomization.yml
      ---
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - ${K8S_TEST_OPERATOR_MANIFEST}
      configMapGenerator:
      - name: linstor-operator-image-config
        namespace: linbit-sds
        options:
          disableNameSuffixHash: true
        behavior: merge
        files:
        - 1_csi-image-config.yaml
      EOF
    - |
      cat <<EOF > virter/1_csi-image-config.yaml
      ---
      base: ${LINBIT_DOCKER_REGISTRY}
      components:
        linstor-csi:
          image: linstor-csi
          tag: ${TAG}
        nfs-server:
          image: nfs-server
          tag: ${TAG}
      EOF
    # Job inputs cannot set variables, so build the vmshed selection here. The
    # array input arrives as a JSON list of the validated suite names.
    - |
      SUITES='${{ job.inputs.suites }}'
      VARIANTS=""
      TORUN=""
      for suite in $(echo "$SUITES" | tr -d '[]"' | tr ',' ' '); do
        case "$suite" in
          k8s-e2e-storage)
            VARIANTS="$VARIANTS,ipv4"
            TORUN="$TORUN,k8s-e2e-storage"
            ;;
          kubevirt)
            VARIANTS="$VARIANTS,kubevirt"
            TORUN="$TORUN,kubevirt"
            ;;
          shared)
            VARIANTS="$VARIANTS,shared"
            TORUN="$TORUN,k8s-e2e-shared-storage,kubevirt-shared,k8s-e2e-shared-storage-lvmlockd,kubevirt-shared-lvmlockd"
            ;;
        esac
      done
      [ -n "$TORUN" ] || { echo "no known suite in $SUITES"; exit 1; }
      export K8S_TEST_VARIANT="${VARIANTS#,}"
      export K8S_TEST_TORUN="${TORUN#,}"
  variables:
    # Have virter-gc free 100 GiB (in bytes) for the larger nested VMs of the
    # kubevirt tests.
    VIRTER_GC_MIN_FREE: "107374182400"

publish:
  stage: publish
  variables:
    DOCKER_AUTH_CONFIG_FROM: DOCKER_PUBLISH_AUTH_CONFIG_FILE
    REPO_SOURCE: ${LINBIT_DOCKER_REGISTRY}/rhel-container-secrets:latest
    REGISTRY: ${PUBLISH_REGISTRY}
    PLATFORMS: ${PUBLISH_PLATFORMS}
    LINBIT_REPO: ${LINBIT_RHEL_DRBD9_REPO}
  rules:
    - if: $CI_COMMIT_BRANCH == 'master'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
  image: ${LINBIT_DOCKER_REGISTRY}/container-tools:latest
  script:
  - docker buildx bake --pull --push
